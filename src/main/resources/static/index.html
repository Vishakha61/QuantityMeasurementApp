<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Quantity Measurement System</title>

    <link
            rel="stylesheet"
            href="css/style.css">

</head>

<body>

<div class="container">

    <!-- ===========================
                Header
    ============================ -->

    <header>

        <h1>

            Quantity Measurement System

        </h1>

        <p>

            Spring Boot + HTML + CSS + JavaScript

        </p>

    </header>

    <!-- ===========================
          Measurement Types
    ============================ -->

    <section class="measurement-section">

        <h2>

            Select Measurement Type

        </h2>

        <div class="measurement-types">

            <div
                    class="type-card active"
                    data-type="LENGTH">

                <div class="icon">

                    📏

                </div>

                <h3>

                    Length

                </h3>

            </div>

            <div
                    class="type-card"
                    data-type="WEIGHT">

                <div class="icon">

                    ⚖️

                </div>

                <h3>

                    Weight

                </h3>

            </div>

            <div
                    class="type-card"
                    data-type="TEMPERATURE">

                <div class="icon">

                    🌡️

                </div>

                <h3>

                    Temperature

                </h3>

            </div>

            <div
                    class="type-card"
                    data-type="VOLUME">

                <div class="icon">

                    🪣

                </div>

                <h3>

                    Volume

                </h3>

            </div>

        </div>

    </section>

    <!-- ===========================
              Operations
    ============================ -->

    <section class="operation-section">

        <h2>

            Select Operation

        </h2>

        <div class="action-buttons">

            <button id="compareBtn">

                Compare

            </button>

            <button id="convertBtn">

                Convert

            </button>

            <button id="addBtn">

                Add

            </button>

            <button id="subtractBtn">

                Subtract

            </button>

            <button id="divideBtn">

                Divide

            </button>

        </div>

    </section>
    <!-- ===========================
          Input Section
============================ -->

    <section class="input-section">

        <!-- Target Unit (Only for Convert) -->

        <div
                class="input-card"
                id="targetUnitSection">

            <label id="targetUnitLabel">

                Target Unit

            </label>

            <select id="targetUnit">

            </select>

        </div>

        <!-- First Quantity -->

        <div class="input-card">

            <label>

                First Quantity

            </label>

            <input
                    type="number"
                    id="value1"
                    placeholder="Enter value">

            <select id="unit1">

            </select>

        </div>

        <!-- Operator -->

        <div
                class="operator"
                id="operator">

            ⇄

        </div>

        <!-- Second Quantity -->

        <div
                class="input-card"
                id="secondQuantitySection">

            <label>

                Second Quantity

            </label>

            <input
                    type="number"
                    id="value2"
                    placeholder="Enter value">

            <select id="unit2">

            </select>

        </div>

    </section>

    <!-- ===========================
             Execute Button
    ============================ -->

    <section class="execute-section">

        <button id="executeBtn">

            Execute Operation

        </button>

    </section>

    <!-- ===========================
               Result
    ============================ -->

    <section class="result-section">

        <h2>

            Result

        </h2>

        <div class="result-container">

            <div
                    id="result"
                    class="result-box">

                Waiting for operation...

            </div>

            <!-- Hidden until Add/Subtract result is available -->

            <div
                    class="result-unit"
                    id="resultUnitSection"
                    style="display:none;">

                <label>

                    Result Unit

                </label>

                <select id="resultUnit">

                </select>

            </div>

        </div>

    </section>

</div>

<script src="js/app.js"></script>

</body>

</html>
