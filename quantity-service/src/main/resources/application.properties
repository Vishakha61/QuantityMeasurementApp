spring.application.name=QuantityService

server.port=8081

# ==========================
# H2 Database
# ==========================

spring.datasource.url=jdbc:h2:mem:quantitydb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Execute schema.sql and data.sql
spring.sql.init.mode=always

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ===============================
# JWT
# NOTE: this secret and expiration MUST be identical to auth-service's
# jwt.secret/jwt.expiration, since tokens issued by auth-service are
# validated here.
# ===============================
jwt.secret=MySuperSecretKeyForQuantityMeasurementApplication2026
jwt.expiration=86400000

logging.level.org.springframework.security=DEBUG
